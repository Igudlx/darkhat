  <!-- Firebase (modular SDK via CDN, matches project's existing usage) -->

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import * as Auth from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import * as Firestore from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { firebaseConfig } from "/js/firebase-config.js";

    const app = initializeApp(firebaseConfig);

    window.__DARKHAT_FIREBASE__ = {
      app,
      auth: Auth.getAuth(app),
      AuthLib: Auth,
      db: Firestore.getFirestore(app),
      FirestoreLib: Firestore,
    };

    window.dispatchEvent(new Event("darkhat:firebase-ready"));
  </script>

  <!-- ===================== LOGIN TAB FIX ===================== -->

  <script>
    (() => {
      function setupLoginTabs() {
        const loginCard = document.getElementById("login-card");
        const loginTab = document.getElementById("login-tab");
        const signupTab = document.getElementById("signup-tab");

        if (!loginCard || !loginTab || !signupTab) return;

        /*
         * Make sure nothing sitting over the login card prevents
         * the tab buttons from receiving pointer input.
         *
         * This does not change the visual appearance.
         */
        loginCard.style.pointerEvents = "auto";
        loginCard.style.position = "relative";
        loginCard.style.zIndex = "1000";

        loginTab.style.pointerEvents = "auto";
        signupTab.style.pointerEvents = "auto";

        /*
         * Use event delegation so this continues to work even if
         * auth.js replaces or modifies elements inside the card.
         */
        if (!window.__DARKHAT_LOGIN_TABS_FIXED__) {
          window.__DARKHAT_LOGIN_TABS_FIXED__ = true;

          document.addEventListener("click", function (event) {
            const tab = event.target.closest(".login-tab");

            if (!tab) return;
            if (!document.getElementById("login-card")) return;

            const tabName = tab.getAttribute("data-tab");

            if (tabName !== "login" && tabName !== "signup") {
              return;
            }

            /*
             * Stop another overlay/handler from preventing the tab
             * from doing its job, while still allowing the existing
             * auth.js handlers to run.
             */
            event.stopPropagation();

            document.querySelectorAll(".login-tab").forEach((button) => {
              button.classList.toggle(
                "active",
                button.getAttribute("data-tab") === tabName
              );
            });

            /*
             * Notify existing auth code that the active tab changed.
             */
            window.dispatchEvent(
              new CustomEvent("darkhat:auth-tab-change", {
                detail: {
                  tab: tabName
                }
              })
            );
          }, true);
        }
      }

      /*
       * Run immediately.
       */
      setupLoginTabs();

      /*
       * Run again after the other modules have initialized,
       * in case auth.js modifies the login UI.
       */
      window.addEventListener("darkhat:firebase-ready", setupLoginTabs);

      document.addEventListener("DOMContentLoaded", setupLoginTabs);

      setTimeout(setupLoginTabs, 100);
      setTimeout(setupLoginTabs, 500);
      setTimeout(setupLoginTabs, 1000);
    })();
  </script>
