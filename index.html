<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>darkhat</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <!-- ===================== LOGIN SCREEN ===================== -->
  <div id="login-screen">
    <div class="login-title wordmark">darkhat</div>

    <div class="login-card" id="login-card">
      <div class="login-tabs">
        <button class="login-tab active" data-tab="login">Log In</button>
        <button class="login-tab" data-tab="signup">Sign Up</button>
      </div>

      <form id="login-form">
        <div class="field">
          <label for="login-email">Email</label>
          <input id="login-email" type="email" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input id="login-password" type="password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="neon-btn" id="login-submit">Log In</button>
        <div class="login-error" id="login-error"></div>
      </form>
    </div>

    <div class="login-status hidden" id="login-status"></div>
  </div>

  <!-- ===================== DESKTOP ===================== -->
  <div id="desktop-root" class="hidden">
    <div id="wallpaper">
      <div class="wp-mark wordmark" id="wallpaper-mark">darkhat</div>
    </div>

    <div id="desktop-icons"></div>
    <div id="window-layer"></div>

    <div id="taskbar">
      <button id="start-btn" title="darkhat">▣</button>
      <div id="taskbar-items"></div>
      <div id="clock"></div>
    </div>

    <div id="start-menu" class="hidden"></div>
  </div>

  <!-- Firebase (modular SDK via CDN, matches project's existing usage) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import * as Auth from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import * as Firestore from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { firebaseConfig } from "/js/firebase-config.js";

    const app = initializeApp(firebaseConfig);
    window.__DARKHAT_FIREBASE__ = {
      app,
      auth: Auth.getAuth(app),
      AuthLib: Auth,
      db: Firestore.getFirestore(app),
      FirestoreLib: Firestore,
    };
    window.dispatchEvent(new Event("darkhat:firebase-ready"));
  </script>

  <script type="module" src="/js/auth.js"></script>
  <script type="module" src="/js/contextMenu.js"></script>
  <script type="module" src="/js/windowManager.js"></script>
  <script type="module" src="/js/fileSystem.js"></script>
  <script type="module" src="/js/desktop.js"></script>
  <script type="module" src="/js/apps/notes.js"></script>
  <script type="module" src="/js/apps/coder.js"></script>
  <script type="module" src="/js/apps/gamehub.js"></script>
  <script type="module" src="/js/apps/ai.js"></script>
  <script type="module" src="/js/apps/extra.js"></script>
  <script type="module" src="/js/apps/settings.js"></script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
